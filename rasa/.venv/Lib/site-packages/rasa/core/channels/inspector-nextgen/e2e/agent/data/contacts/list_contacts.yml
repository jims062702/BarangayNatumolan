flows:
  list_contacts:
    name: show your contact list
    description: |
      Show the people in your contacts list along with their details. The user can transfer money to these contacts, so they are valid payees as well.
    steps:
      - action: list_contacts
        next:
          - if: slots.contacts_list
            then:
              - action: utter_list_contacts
                next: END
          - else:
              - action: utter_no_contacts
                next: END
