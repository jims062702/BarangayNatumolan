version: "3.1"

slots:
  bank_name:
    type: text
    initial_value: "Fenlo"
    mappings:
      - type: controlled
  skills_summary:
    type: text
    initial_value: "Fenlo banking, inspector E2E diagnostics, Context7 library lookups, and DeepWiki GitHub repo questions"
    mappings:
      - type: controlled
  example_questions:
    type: text
    initial_value: |
      Banking:
      - What's my account balance?
      - Transfer $50 to Alice today.
      - Block my Visa temporarily.
      - Download my June 2024 statement as a PDF.

      Inspector diagnostics:
      - inspector test direct mcp success
      - inspector test custom tool success
      - inspector test custom tool failure
      - inspector test agent success
      - inspector test memory and buttons
      - inspector test direct mcp failure
      - inspector test action failure

      Context7:
      - What is the Context7 id for next.js?
      - How do I use middleware in Next.js?

      DeepWiki / GitHub:
      - How does routing work in rasaHQ/rasa?
      - Using MCP, what is rasaHQ/rasa?
    mappings:
      - type: controlled
  agent_name:
    type: text
    initial_value: "Finley"
    mappings:
      - type: controlled

responses:
  utter_greeting:
    - text: "Hi there! I'm {agent_name} 👋. I can help you with {skills_summary}. \n Here's a few things you can ask me: {example_questions} \n How can I help you today?"
      metadata:
        rephrase: True
    - text: "Hi there! I'm {agent_name}. I can help you with things like transferring money, checking your balance, and answering your finance questions. What would you like to do?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_hello:
    - text: "Hi nice to meet you - I'm here to help with your {bank_name} account. How can I assist you?"
      metadata:
        rephrase: True
    - text: "Hi! I'm here to help with your {bank_name} account. What can I help you with?"
      metadata:
        rephrase: True
      channel: "browser_audio"
  utter_help:
    - text: "I can help you with {skills_summary}. \n\n Here's a few things you can ask me: \n {example_questions}\n What can I help you with?"
    - text: "I can transfer money, check your balance, block a card, or answer general finance questions. What can I help you with?"
      metadata:
        rephrase: True
      channel: "browser_audio"
