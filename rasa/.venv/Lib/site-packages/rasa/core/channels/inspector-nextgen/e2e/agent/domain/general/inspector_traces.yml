version: "3.1"

actions:
  - "action_inspector_raise_failure"

slots:
  inspector_library_name:
    type: text
    mappings:
      - type: from_llm

  inspector_lookup_reason:
    type: text
    mappings:
      - type: from_llm

  inspector_resolved_library_id:
    type: text
    mappings:
      - type: controlled

  inspector_memory_note:
    type: text
    mappings:
      - type: from_llm

  inspector_trace_mode:
    type: categorical
    values:
      - "Events"
      - "Memory"
      - "History"
    mappings:
      - type: from_llm

  inspector_bad_mcp_query:
    type: text
    mappings:
      - type: from_llm

  inspector_bad_mcp_result:
    type: text
    mappings:
      - type: controlled

responses:
  utter_ask_inspector_library_name:
    - text: "Inspector direct MCP test: which library should Context7 resolve?"
    - channel: browser_audio
      text: "Inspector direct MCP test: which library should Context7 resolve?"

  utter_ask_inspector_lookup_reason:
    - text: "Inspector direct MCP test: what short lookup reason should I send to Context7?"
    - channel: browser_audio
      text: "Inspector direct MCP test: what short lookup reason should I send to Context7?"

  utter_inspector_mcp_success_summary:
    - text: "Inspector direct MCP success: Context7 resolved {inspector_library_name} to {inspector_resolved_library_id}."
    - channel: browser_audio
      text: "Inspector direct MCP success: Context7 resolved {inspector_library_name} to {inspector_resolved_library_id}."

  utter_ask_inspector_memory_note:
    - text: "Inspector memory test: give me a short note to store in memory."
    - channel: browser_audio
      text: "Inspector memory test: give me a short note to store in memory."

  utter_ask_inspector_trace_mode:
    - text: "Inspector memory test: which Inspector view should this scenario highlight?"
      buttons:
        - payload: "/SetSlots(inspector_trace_mode=Events)"
          title: "Events"
        - payload: "/SetSlots(inspector_trace_mode=Memory)"
          title: "Memory"
        - payload: "/SetSlots(inspector_trace_mode=History)"
          title: "History"
    - channel: browser_audio
      text: "Inspector memory test: which Inspector view should this scenario highlight?"
      buttons:
        - payload: "/SetSlots(inspector_trace_mode=Events)"
          title: "Events"
        - payload: "/SetSlots(inspector_trace_mode=Memory)"
          title: "Memory"
        - payload: "/SetSlots(inspector_trace_mode=History)"
          title: "History"

  utter_inspector_memory_buttons_summary:
    - text: >
        Inspector memory and buttons trace captured note "{inspector_memory_note}"
        with mode "{inspector_trace_mode}". Review the Memory view, Bot details,
        buttons, and custom payload for this response.
      image: "https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png"
      buttons:
        - payload: "/SetSlots(inspector_trace_mode=Events)"
          title: "Show Events"
        - payload: "/SetSlots(inspector_trace_mode=Memory)"
          title: "Show Memory"
      custom:
        inspector_trace_fixture: true
        expected_views:
          - "Events"
          - "Memory"
          - "Bot details"
      metadata:
        rephrase: False
    - channel: browser_audio
      text: >
        Inspector memory and buttons trace captured note "{inspector_memory_note}"
        with mode "{inspector_trace_mode}". Review the Memory view, Bot details,
        buttons, and custom payload for this response.
      image: "https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png"
      buttons:
        - payload: "/SetSlots(inspector_trace_mode=Events)"
          title: "Show Events"
        - payload: "/SetSlots(inspector_trace_mode=Memory)"
          title: "Show Memory"
      custom:
        inspector_trace_fixture: true
        expected_views:
          - "Events"
          - "Memory"
          - "Bot details"
      metadata:
        rephrase: False

  utter_ask_inspector_bad_mcp_query:
    - text: "Inspector direct MCP failure test: what query should I send to the unreachable MCP server?"
    - channel: browser_audio
      text: "Inspector direct MCP failure test: what query should I send to the unreachable MCP server?"
