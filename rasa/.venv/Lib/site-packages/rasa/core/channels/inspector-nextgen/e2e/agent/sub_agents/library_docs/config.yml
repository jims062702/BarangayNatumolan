agent:
  name: library_docs
  description: >
    Given a library name and a user question, look up the library on Context7
    (resolve-library-id) and fetch documentation (get-library-docs). Return a
    concise, documentation-grounded answer; cite the source URL when one is
    returned. When the user is satisfied, call task_completed.

configuration:
  llm:
    model_group: openai-gpt-5-1
  tool_timeout: 120
  max_retries: 3

connections:
  mcp_servers:
    - name: context7
