flows:
  inspector_direct_mcp_success:
    name: Inspector direct MCP success
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says
      "inspector test direct mcp success".
    steps:
      - collect: inspector_library_name
        description: "Library name to resolve through Context7 during Inspector testing."
      - collect: inspector_lookup_reason
        description: "Short lookup context for the Inspector direct MCP success scenario."
      - call: resolve-library-id
        mcp_server: context7
        mapping:
          input:
            - param: libraryName
              slot: inspector_library_name
            - param: query
              slot: inspector_lookup_reason
          output:
            - slot: inspector_resolved_library_id
              value: result.content
      - action: utter_inspector_mcp_success_summary

  inspector_custom_tool_success:
    name: Inspector custom tool success
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says
      "inspector test custom tool success".
    steps:
      - call: inspector_toolbox

  inspector_custom_tool_error:
    name: Inspector custom tool error
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says the exact phrase
      "inspector test custom tool failure" (ReAct custom tool, not custom action).
    steps:
      - call: inspector_toolbox

  inspector_agent_success:
    name: Inspector agent success
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says
      "inspector test agent success".
    steps:
      - collect: library_name
        description: "Library name for the Inspector agent success scenario."
      - collect: library_question
        description: "Documentation question for the Inspector agent success scenario."
      - call: library_docs

  inspector_memory_and_buttons:
    name: Inspector memory and buttons
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says
      "inspector test memory and buttons".
    steps:
      - collect: inspector_memory_note
        description: "A short note to show in the Inspector Memory view."
      - collect: inspector_trace_mode
        description: "The Inspector trace mode selected with buttons."
      - action: utter_inspector_memory_buttons_summary

  inspector_direct_mcp_failure:
    name: Inspector direct MCP failure
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says
      "inspector test direct mcp failure".
    steps:
      - collect: inspector_bad_mcp_query
        description: "Diagnostic query sent to an intentionally unreachable MCP server."
      - call: unavailable-tool
        mcp_server: inspector_unreachable_mcp
        mapping:
          input:
            - param: query
              slot: inspector_bad_mcp_query
          output:
            - slot: inspector_bad_mcp_result
              value: result.content

  inspector_custom_action_failure:
    name: Inspector custom action failure
    description: >
      Diagnostic flow for next-gen Inspector testing. Use only when the user says the exact phrase
      "inspector test action failure" (custom action, not custom tool).
    steps:
      - action: action_inspector_raise_failure
