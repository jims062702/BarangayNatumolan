flows:
  list_cards:
    name: show your card list
    description: |
      Show cards along with the account information the cards are linked to.
    steps:
      - action: list_cards
        next:
          - if: slots.cards_list
            then:
              - action: utter_list_cards
                next: END
          - else:
              - action: utter_no_cards
                next: END
