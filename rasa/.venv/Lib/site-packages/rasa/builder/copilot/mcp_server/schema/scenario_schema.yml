mapping:
  scenario:
    type: map
    required: true
    mapping:
      name:
        type: str
        required: true
      simulation_context:
        type: str
        required: true
      setup:
        type: map
        mapping:
          initial_slots:
            type: map
            allowempty: true
            matching: any
            mapping:
              regex;(.+):
                type: any
      goals:
        type: map
        mapping:
          assertions:
            include: scenario_assertions
          criteria:
            type: seq
            sequence:
              - type: str

schema;sequencing_steps:
  type: seq
  matching: any
  sequence:
    - type: map
      matching: any
      range:
        min: 1
        max: 1
      mapping:
        action_executed:
          type: str
          nullable: false
        slot_was_set:
          type: str
          nullable: false
        flow_started:
          type: str
          nullable: false
        flow_completed:
          type: str
          nullable: false
        flow_cancelled:
          type: str
          nullable: false
        flow_interrupted:
          type: str
          nullable: false

schema;scenario_assertions:
  func: require_assertion_keys
  type: seq
  matching: any
  sequence:
    - type: map
      matching: any
      range:
        min: 1
        max: 1
      mapping:
        flow_started:
          type: any
          nullable: false
        flow_completed:
          type: map
          mapping:
            flow_id:
              type: str
              required: true
            flow_step_id:
              type: str
        flow_cancelled:
          type: map
          mapping:
            flow_id:
              type: str
              required: true
            flow_step_id:
              type: str
        pattern_clarification_contains:
          type: any
          nullable: false
        action_executed:
          type: str
          nullable: false
        slot_was_set:
          type: seq
          matching: all
          nullable: false
          sequence:
            - type: map
              mapping:
                name:
                  type: str
                  required: true
                value:
                  type: any
        slot_was_not_set:
          type: seq
          matching: all
          nullable: false
          sequence:
            - type: map
              mapping:
                name:
                  type: str
                  required: true
                value:
                  type: any
        bot_uttered:
          type: map
          nullable: false
          mapping:
            utter_name:
              type: str
              nullable: false
            buttons:
              type: seq
              nullable: false
              matching: all
              sequence:
                - type: map
                  mapping:
                    title:
                      type: str
                      nullable: false
                    payload:
                      type: str
                      nullable: false
            text_matches:
              type: str
              nullable: false
        bot_did_not_utter:
          type: map
          nullable: false
          mapping:
            utter_name:
              type: str
              nullable: false
            buttons:
              type: seq
              nullable: false
              matching: all
              sequence:
                - type: map
                  mapping:
                    title:
                      type: str
                      nullable: false
                    payload:
                      type: str
                      nullable: false
            text_matches:
              type: str
              nullable: false
        generative_response_is_relevant:
          type: map
          mapping:
            threshold:
              type: float
              required: true
            utter_name:
              type: str
              nullable: false
            utter_source:
              type: str
              nullable: false
        generative_response_is_grounded:
          type: map
          mapping:
            threshold:
              type: float
              required: true
            utter_name:
              type: str
              nullable: false
            ground_truth:
              type: str
              nullable: false
            utter_source:
              type: str
              nullable: false
        sequencing:
          include: sequencing_steps
