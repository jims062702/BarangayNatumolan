# Rasa Pro (Developer Edition) — Barangay Natumolan assistant.
# NLU-based pipeline that trains and runs fully offline (no LLM API key
# needed) using the scikit-learn components bundled with rasa-pro 3.18.
recipe: default.v1
language: en
assistant_id: barangay-natumolan-assistant

pipeline:
  - name: WhitespaceTokenizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: LogisticRegressionClassifier
    max_iter: 200
  # Real questions score 0.9+; gibberish lands under 0.5 — 0.6 separates them.
  - name: FallbackClassifier
    threshold: 0.6

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
